services:
  - type: web
    name: pahunch-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PAHUNCH_JWT_SECRET
        generateValue: true
      - key: PAHUNCH_CORS_ORIGINS
        sync: false
